<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bento — Workouts home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1b1b24}a:hover{color:#4a4a5c}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #f1f2f6; color: #1b1b24; font-family: 'Bricolage Grotesque', system-ui, sans-serif; padding: 60px 16px 0 16px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px 4px 4px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; color: #5a5b6b">Tuesday, 7 October</div>
<h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05">Good morning</h1>
</div>
<button aria-label="Settings" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: #ffffff; color: #1b1b24; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg></button>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="grid-row: span 2; background: #ffd9bf; border-radius: 28px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; height: 228px; box-sizing: border-box">
<div style="width: 48px; height: 48px; border-radius: 24px; background: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#c2410c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-2 2-5 5-5 8 0 4 3 7 7 7z"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 64px; font-weight: 800; line-height: 0.9; letter-spacing: -0.04em; color: #5a2106">12</div>
<div style="font-size: 16px; font-weight: 600; color: #5a2106">day streak</div>
<div style="font-size: 13px; color: #7a3a14">Best this year: 19</div>
</div>
</div>
<div style="background: #d6e8ff; border-radius: 28px; padding: 16px; display: flex; flex-direction: column; gap: 6px; height: 108px; box-sizing: border-box">
<div style="font-size: 13px; font-weight: 600; color: #123a6b">Consistency</div>
<div style="font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: #0b2a52">87%</div>
<div style="height: 8px; border-radius: 4px; background: #ffffff"><div style="width: 87%; height: 8px; border-radius: 4px; background: #2563c9"></div></div>
</div>
<div style="background: #ffffff; border-radius: 28px; padding: 16px; display: flex; flex-direction: column; gap: 8px; height: 108px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; font-weight: 600; color: #5a5b6b">This week</span><span style="font-size: 18px; font-weight: 800">214m</span></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; align-items: end; flex-grow: 1">
<div style="height: 40%; border-radius: 6px; background: #fb923c"></div>
<div style="height: 70%; border-radius: 6px; background: #38bdf8"></div>
<div style="height: 10%; border-radius: 6px; background: #e3e4ea"></div>
<div style="height: 60%; border-radius: 6px; background: #a78bfa"></div>
<div style="height: 100%; border-radius: 6px; background: #fb923c"></div>
<div style="height: 45%; border-radius: 6px; background: #4ade80"></div>
<div style="height: 10%; border-radius: 6px; background: #e3e4ea"></div>
</div>
</div>
</div>

<div style="background: #1b1b24; color: #ffffff; border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 13px; color: #b8b9c8">Up next</div>
<div style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">Full body A</div>
</div>
<span style="padding: 6px 12px; border-radius: 999px; background: #2e2e3c; font-size: 13px; color: #e4e4ee">32 min</span>
</div>
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="padding: 6px 10px; border-radius: 999px; background: #2e2e3c; font-size: 12px; color: #e4e4ee">Squats</span>
<span style="padding: 6px 10px; border-radius: 999px; background: #2e2e3c; font-size: 12px; color: #e4e4ee">Push-ups</span>
<span style="padding: 6px 10px; border-radius: 999px; background: #2e2e3c; font-size: 12px; color: #e4e4ee">Rows</span>
<span style="padding: 6px 10px; border-radius: 999px; background: #2e2e3c; font-size: 12px; color: #e4e4ee">+5</span>
</div>
<button style="height: 52px; border-radius: 26px; border: none; background: {{accent}}; color: #1b1b24; font-family: inherit; font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"></path></svg>Start workout</button>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<button style="height: 84px; border-radius: 24px; border: none; background: #d4f0ff; color: #0b3a52; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4" r="2"></circle><path d="M8 21l3-6 3 2v5M6 12l3-4 4 1 3 3 3 1"></path></svg>Run</button>
<button style="height: 84px; border-radius: 24px; border: none; background: #d6f5e0; color: #0e4425; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"></circle><path d="M10 21l2-6 2 2v4M9 13l1-4 3 1 2 3"></path></svg>Walk</button>
<button style="height: 84px; border-radius: 24px; border: none; background: #e7e0ff; color: #33206e; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17" r="3.5"></circle><circle cx="18.5" cy="17" r="3.5"></circle><path d="M5.5 17l4-8h6l3 8M9.5 9L12 17h-3"></path></svg>Ride</button>
<button style="height: 84px; border-radius: 24px; border: none; background: #ffdede; color: #6b1616; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="13" height="10" rx="4"></rect><path d="M7 14v4a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-4M10 4v5"></path></svg>Box</button>
</div>

<nav aria-label="Main" style="position: absolute; left: 24px; right: 24px; bottom: 26px; height: 64px; border-radius: 32px; background: #1b1b24; padding: 8px; box-sizing: border-box; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; align-items: center">
<button aria-label="Workouts" style="height: 48px; border-radius: 24px; border: none; background: {{accent}}; color: #1b1b24; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg></button>
<button aria-label="Exercises" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: #b8b9c8; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4" r="2"></circle><path d="M8 21l3-6 3 2v5M6 12l3-4 4 1 3 3 3 1"></path></svg></button>
<button aria-label="Health" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: #b8b9c8; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-4 3 8 2-4h7"></path></svg></button>
<button aria-label="History" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: #b8b9c8; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></button>
<button aria-label="Stats" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: #b8b9c8; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd23f","options":["#ffd23f","#7ee0a8","#ff9d6b","#9fc5ff"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#ffd23f' };
}
}
</script>
</body>
</html>
