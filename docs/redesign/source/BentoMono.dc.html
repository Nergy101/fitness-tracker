<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bento Mono — Workouts home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&amp;family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{p.bg}}; color: {{p.fg}}; font-family: 'Manrope', system-ui, sans-serif; padding: 60px 16px 0 16px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 14px; font-weight: 600; color: {{p.muted}}">Tue, 7 October</div>
<h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05">Good morning</h1>
</div>
<button aria-label="Settings" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: {{p.t1}}; color: {{p.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg></button>
</div>

<div style="height: 170px; box-sizing: border-box; background: {{p.t2}}; border-radius: 30px; padding: 18px 20px; display: flex; justify-content: space-between; align-items: stretch">
<div style="display: flex; flex-direction: column; justify-content: space-between">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em">STREAK</span>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Unbounded', sans-serif; font-size: 88px; font-weight: 800; line-height: 0.8; letter-spacing: -0.04em">12</span>
<span style="font-size: 14px; font-weight: 700">days in a row</span>
</div>
</div>
<div style="display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-2 2-5 5-5 8 0 4 3 7 7 7z"></path></svg>
<div style="display: grid; grid-template-columns: repeat(7, 14px); gap: 4px">
<span style="height: 14px; border-radius: 4px; background: {{p.strong}}"></span>
<span style="height: 14px; border-radius: 4px; background: {{p.strong}}"></span>
<span style="height: 14px; border-radius: 4px; background: {{p.t1}}"></span>
<span style="height: 14px; border-radius: 4px; background: {{p.strong}}"></span>
<span style="height: 14px; border-radius: 4px; background: {{p.strong}}"></span>
<span style="height: 14px; border-radius: 4px; background: {{p.strong}}"></span>
<span style="height: 14px; border-radius: 4px; border: 2px dashed {{p.fg}}; box-sizing: border-box"></span>
</div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="height: 110px; box-sizing: border-box; background: {{p.t1}}; border-radius: 26px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: {{p.muted}}">CONSISTENCY</span>
<div style="display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Unbounded', sans-serif; font-size: 30px; font-weight: 700; line-height: 1">87%</span><div style="height: 6px; border-radius: 3px; background: {{p.t2}}"><div style="width: 87%; height: 6px; border-radius: 3px; background: {{p.fg}}"></div></div></div>
</div>
<div style="height: 110px; box-sizing: border-box; background: {{p.t1}}; border-radius: 26px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: {{p.muted}}">WEEK</span><span style="font-family: 'Unbounded', sans-serif; font-size: 16px; font-weight: 700">214m</span></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; align-items: end; height: 46px">
<div style="height: 40%; border-radius: 4px; background: {{p.fg}}"></div>
<div style="height: 70%; border-radius: 4px; background: {{p.fg}}"></div>
<div style="height: 10%; border-radius: 4px; background: {{p.t2}}"></div>
<div style="height: 60%; border-radius: 4px; background: {{p.fg}}"></div>
<div style="height: 100%; border-radius: 4px; background: {{p.fg}}"></div>
<div style="height: 45%; border-radius: 4px; background: {{p.fg}}"></div>
<div style="height: 10%; border-radius: 4px; background: {{p.t2}}"></div>
</div>
</div>
</div>

<div style="height: 96px; box-sizing: border-box; background: {{p.strong}}; color: {{p.onStrong}}; border-radius: 28px; padding: 16px 16px 16px 20px; display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em">UP NEXT</span>
<span style="font-family: 'Unbounded', sans-serif; font-size: 22px; font-weight: 700; line-height: 1">Full body A</span>
<span style="font-size: 13px; font-weight: 600">32 min · 8 exercises</span>
</div>
<button aria-label="Start Full body A" style="width: 60px; height: 60px; border-radius: 30px; border: none; background: {{p.onStrong}}; color: {{p.strong}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"></path></svg></button>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<button style="border: none; background: transparent; color: {{p.fg}}; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 0"><span style="width: 64px; height: 64px; border-radius: 32px; background: {{p.t1}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4" r="2"></circle><path d="M8 21l3-6 3 2v5M6 12l3-4 4 1 3 3 3 1"></path></svg></span>Run</button>
<button style="border: none; background: transparent; color: {{p.fg}}; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 0"><span style="width: 64px; height: 64px; border-radius: 32px; background: {{p.t1}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"></circle><path d="M10 21l2-6 2 2v4M9 13l1-4 3 1 2 3"></path></svg></span>Walk</button>
<button style="border: none; background: transparent; color: {{p.fg}}; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 0"><span style="width: 64px; height: 64px; border-radius: 32px; background: {{p.t1}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17" r="3.5"></circle><circle cx="18.5" cy="17" r="3.5"></circle><path d="M5.5 17l4-8h6l3 8M9.5 9L12 17h-3"></path></svg></span>Ride</button>
<button style="border: none; background: transparent; color: {{p.fg}}; display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; padding: 0"><span style="width: 64px; height: 64px; border-radius: 32px; background: {{p.t1}}; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="13" height="10" rx="4"></rect><path d="M7 14v4a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-4M10 4v5"></path></svg></span>Box</button>
</div>

<nav aria-label="Main" style="position: absolute; left: 24px; right: 24px; bottom: 26px; height: 64px; border-radius: 32px; background: {{p.fg}}; padding: 8px; box-sizing: border-box; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; align-items: center">
<button aria-label="Workouts" style="height: 48px; border-radius: 24px; border: none; background: {{p.strong}}; color: {{p.onStrong}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg></button>
<button aria-label="Exercises" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{p.t2}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4" r="2"></circle><path d="M8 21l3-6 3 2v5M6 12l3-4 4 1 3 3 3 1"></path></svg></button>
<button aria-label="Health" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{p.t2}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-4 3 8 2-4h7"></path></svg></button>
<button aria-label="History" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{p.t2}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></button>
<button aria-label="Stats" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{p.t2}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"hue":{"editor":"enum","default":"tangerine","options":["tangerine","ocean","forest"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var dark = this.props.dark ?? false;
var hue = this.props.hue ?? 'tangerine';
var palettes = {
tangerine: {
light: { bg: '#fbf4ee', t1: '#ffe8d6', t2: '#ffd2ad', strong: '#ff8a3d', onStrong: '#2a1203', fg: '#3b1a05', muted: '#7a4a2a' },
dark: { bg: '#140c07', t1: '#22150c', t2: '#3a2412', strong: '#ff8a3d', onStrong: '#2a1203', fg: '#ffe8d6', muted: '#c49a7c' }
},
ocean: {
light: { bg: '#eef4fb', t1: '#dcebfb', t2: '#bcd8f7', strong: '#5aa8ff', onStrong: '#06152b', fg: '#0b2448', muted: '#3f5a7f' },
dark: { bg: '#070d16', t1: '#0f1b2b', t2: '#1a3452', strong: '#5aa8ff', onStrong: '#06152b', fg: '#dcebfb', muted: '#8fa9c9' }
},
forest: {
light: { bg: '#eff6f0', t1: '#dcefdf', t2: '#bfe3c5', strong: '#4fd17c', onStrong: '#062010', fg: '#0c2e17', muted: '#3f6a4c' },
dark: { bg: '#08110b', t1: '#112016', t2: '#1d3a25', strong: '#4fd17c', onStrong: '#062010', fg: '#dcefdf', muted: '#8fb89a' }
}
};
var set = palettes[hue] || palettes.tangerine;
return { p: dark ? set.dark : set.light };
}
}
</script>
</body>
</html>
