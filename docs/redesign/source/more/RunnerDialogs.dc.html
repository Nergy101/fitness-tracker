<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout runner — stop confirm and swap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1800px; height: 844px; display: flex; gap: 80px">
<sc-for list="{{screens}}" as="s" hint-placeholder-count="4">
<div style="width: 390px; height: 844px; flex-shrink: 0; box-sizing: border-box; position: relative; overflow: hidden; background: {{s.t.bg}}; color: {{s.t.fg}}; font-family: 'Bricolage Grotesque', system-ui, sans-serif">

<div style="position: absolute; inset: 0; padding: 68px 16px 0 16px; display: flex; flex-direction: column; gap: 12px; align-items: stretch">
<div style="height: 44px"></div>
<div style="height: 120px; border-radius: 28px; background: {{s.t.orange.bg}}"></div>
<div style="width: 210px; height: 210px; border-radius: 105px; border: 16px solid {{s.t.track}}; box-sizing: border-box; align-self: center"></div>
</div>
<div style="position: absolute; inset: 0; background: {{s.t.scrim}}"></div>

<sc-if value="{{s.stop}}" hint-placeholder-val="{{ true }}">
<div role="alertdialog" aria-label="Stop workout?" style="position: absolute; left: 20px; right: 20px; top: 260px; background: {{s.t.surface}}; border-radius: 30px; padding: 22px; display: flex; flex-direction: column; gap: 10px">
<span style="width: 52px; height: 52px; border-radius: 26px; background: {{s.t.red.bg}}; color: {{s.t.red.fg}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg></span>
<span style="font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Stop workout?</span>
<span style="font-size: 15px; color: {{s.t.muted}}; line-height: 1.4">You've done 3 of 8 exercises (11 min). Save what you did, or throw it away.</span>
<button style="height: 54px; border-radius: 27px; border: none; background: {{s.t.inv.bg}}; color: {{s.t.inv.fg}}; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer; margin-top: 6px">Save partial session</button>
<button style="height: 54px; border-radius: 27px; border: none; background: {{s.t.red.bg}}; color: {{s.t.red.fg}}; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Discard</button>
<button style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{s.t.fg}}; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Keep going</button>
</div>
</sc-if>

<sc-if value="{{s.swap}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Swap exercise" style="position: absolute; left: 0; right: 0; bottom: 0; top: 200px; background: {{s.t.surface}}; border-radius: 32px 32px 0 0; padding: 10px 20px 30px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<div style="width: 40px; height: 5px; border-radius: 3px; background: {{s.t.track}}; align-self: center"></div>
<div style="display: flex; align-items: center; gap: 12px">
<div style="display: flex; flex-direction: column; flex-grow: 1"><h2 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Swap exercise</h2><span style="font-size: 13px; color: {{s.t.muted}}">Replacing Bent-over rows · Back</span></div>
<button aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: {{s.t.track}}; color: {{s.t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<label style="height: 48px; box-sizing: border-box; border-radius: 24px; background: {{s.t.field}}; padding: 0 16px; display: flex; align-items: center; gap: 10px; color: {{s.t.muted}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search exercises</span>
<input type="search" placeholder="Search..." style="flex-grow: 1; border: none; background: transparent; font-family: inherit; font-size: 16px; color: {{s.t.fg}}; outline: none">
</label>
<span style="font-size: 12px; font-weight: 700; color: {{s.t.muted}}">Same muscle group</span>
<sc-for list="{{alts}}" as="a" hint-placeholder-count="4">
<button style="display: flex; align-items: center; gap: 12px; height: 60px; border-radius: 20px; border: none; background: {{s.t.field}}; color: {{s.t.fg}}; padding: 0 12px; font-family: inherit; text-align: left; cursor: pointer">
<span style="width: 40px; height: 40px; border-radius: 14px; background: {{s.t.orange.bg}}; color: {{s.t.orange.fg}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 800; flex-shrink: 0">{{a.ab}}</span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 700">{{a.name}}</span><span style="font-size: 12px; color: {{s.t.muted}}">{{a.meta}}</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"></path></svg>
</button>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1800,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var L = { bg: '#f1f2f6', surface: '#ffffff', fg: '#1b1b24', muted: '#5a5b6b', track: '#e9eaef', field: '#f1f2f6', scrim: 'rgba(20,20,32,0.5)',
inv: { bg: '#1b1b24', fg: '#ffffff', muted: '#b8b9c8' }, nav: { bg: '#1b1b24', icon: '#b8b9c8' },
orange: { bg: '#ffd9bf', fg: '#5a2106', icon: '#c2410c', chip: '#ffffff' }, blue: { bg: '#d6e8ff', fg: '#0b2a52', bar: '#2563c9', track: '#ffffff' },
purple: { bg: '#e7e0ff', fg: '#33206e', chip: '#ffffff' }, sky: { bg: '#d4f0ff', fg: '#0b3a52', chip: '#ffffff' },
green: { bg: '#d6f5e0', fg: '#0e4425', chip: '#ffffff' }, red: { bg: '#ffdede', fg: '#6b1616', chip: '#ffffff' } };
var D = { bg: '#111118', surface: '#1c1c26', fg: '#f1f1f6', muted: '#a3a4b5', track: '#2c2c3a', field: '#262633', scrim: 'rgba(0,0,0,0.62)',
inv: { bg: '#f1f1f6', fg: '#111118', muted: '#5a5b6b' }, nav: { bg: '#26263a', icon: '#a3a4b5' },
orange: { bg: '#3a1f10', fg: '#ffd9bf', icon: '#fb923c', chip: '#4d2a15' }, blue: { bg: '#13263f', fg: '#d6e8ff', bar: '#60a5fa', track: '#22395a' },
purple: { bg: '#251c44', fg: '#e7e0ff', chip: '#33285a' }, sky: { bg: '#0f2a36', fg: '#bfe8fb', chip: '#17394a' },
green: { bg: '#10291a', fg: '#c4f5d4', chip: '#173a25' }, red: { bg: '#2e1414', fg: '#ffd0d0', chip: '#451e1e' } };
var alts = [
{ ab: 'Sr', name: 'Seated cable row', meta: 'Back · Cable' },
{ ab: 'Pu', name: 'Pull-ups', meta: 'Back · Bodyweight' },
{ ab: 'Ir', name: 'Inverted row', meta: 'Back · Bodyweight' },
{ ab: 'Bp', name: 'Band pull-apart', meta: 'Back · Band' }
];
return {
screens: [
{ t: L, stop: true, swap: false },
{ t: D, stop: true, swap: false },
{ t: L, stop: false, swap: true },
{ t: D, stop: false, swap: true }
],
alts: alts
};
}
}
</script>
</body>
</html>
