<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout runner — rest</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 860px; height: 844px; display: flex; gap: 80px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="width: 390px; height: 844px; flex-shrink: 0; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.blue.bg}}; color: {{t.blue.fg}}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; padding: 68px 16px 30px 16px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; gap: 10px">
<button aria-label="Stop workout" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: {{t.blue.track}}; color: {{t.blue.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px">
<div style="height: 6px; border-radius: 3px; background: {{t.blue.fg}}"></div>
<div style="height: 6px; border-radius: 3px; background: {{t.blue.fg}}"></div>
<div style="height: 6px; border-radius: 3px; background: {{t.blue.fg}}"></div>
<div style="height: 6px; border-radius: 3px; background: {{t.blue.track}}"></div>
<div style="height: 6px; border-radius: 3px; background: {{t.blue.track}}"></div>
<div style="height: 6px; border-radius: 3px; background: {{t.blue.track}}"></div>
<div style="height: 6px; border-radius: 3px; background: {{t.blue.track}}"></div>
<div style="height: 6px; border-radius: 3px; background: {{t.blue.track}}"></div>
</div>
<span style="font-size: 13px; font-weight: 700">3 / 8</span>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
<span style="font-size: 16px; font-weight: 800; letter-spacing: 0.08em">REST</span>
<span style="font-size: 132px; font-weight: 800; letter-spacing: -0.06em; line-height: 0.9">0:20</span>
<span style="font-size: 15px">Breathe. Shake it out.</span>
<div style="display: flex; gap: 10px; margin-top: 18px">
<button style="height: 52px; padding: 0 22px; border-radius: 26px; border: none; background: {{t.blue.track}}; color: {{t.blue.fg}}; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer">+15 s</button>
<button aria-label="Skip rest timer" style="height: 52px; padding: 0 22px; border-radius: 26px; border: none; background: {{t.blue.fg}}; color: {{t.blue.bg}}; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Skip rest</button>
</div>
</div>

<div style="background: {{t.surface}}; color: {{t.fg}}; border-radius: 28px; padding: 14px; display: flex; gap: 14px; align-items: center">
<div style="width: 72px; height: 72px; border-radius: 18px; background: {{t.orange.bg}}; color: {{t.orange.fg}}; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; text-align: center; flex-shrink: 0">[Exercise<br>image]</div>
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1">
<span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">Next up</span>
<span style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05">Lunges</span>
<span style="font-size: 13px; color: {{t.muted}}">45 s · Legs · Bodyweight</span>
</div>
</div>
<div style="background: {{t.surface}}; color: {{t.fg}}; border-radius: 22px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 13px; color: {{t.muted}}">Last set</span>
<span style="font-size: 14px; font-weight: 800">Rows · 12 × 16 kg · RPE 8</span>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd23f","options":["#ffd23f","#7ee0a8","#ff9d6b","#9fc5ff"]},"$preview":{"width":860,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var L = { bg: '#f1f2f6', surface: '#ffffff', fg: '#1b1b24', muted: '#5a5b6b', track: '#e9eaef', field: '#f1f2f6', scrim: 'rgba(20,20,32,0.5)',
inv: { bg: '#1b1b24', fg: '#ffffff', muted: '#b8b9c8' }, nav: { bg: '#1b1b24', icon: '#b8b9c8' },
orange: { bg: '#ffd9bf', fg: '#5a2106', icon: '#c2410c', chip: '#ffffff' }, blue: { bg: '#d6e8ff', fg: '#0b2a52', bar: '#2563c9', track: '#b9d5fb' },
purple: { bg: '#e7e0ff', fg: '#33206e', chip: '#ffffff' }, sky: { bg: '#d4f0ff', fg: '#0b3a52', chip: '#ffffff' },
green: { bg: '#d6f5e0', fg: '#0e4425', chip: '#ffffff' }, red: { bg: '#ffdede', fg: '#6b1616', chip: '#ffffff' } };
var D = { bg: '#111118', surface: '#1c1c26', fg: '#f1f1f6', muted: '#a3a4b5', track: '#2c2c3a', field: '#262633', scrim: 'rgba(0,0,0,0.62)',
inv: { bg: '#f1f1f6', fg: '#111118', muted: '#5a5b6b' }, nav: { bg: '#26263a', icon: '#a3a4b5' },
orange: { bg: '#3a1f10', fg: '#ffd9bf', icon: '#fb923c', chip: '#4d2a15' }, blue: { bg: '#13263f', fg: '#d6e8ff', bar: '#60a5fa', track: '#22395a' },
purple: { bg: '#251c44', fg: '#e7e0ff', chip: '#33285a' }, sky: { bg: '#0f2a36', fg: '#bfe8fb', chip: '#17394a' },
green: { bg: '#10291a', fg: '#c4f5d4', chip: '#173a25' }, red: { bg: '#2e1414', fg: '#ffd0d0', chip: '#451e1e' } };
return { themes: [L, D], accent: this.props.accent ?? '#ffd23f' };
}
}
</script>
</body>
</html>
