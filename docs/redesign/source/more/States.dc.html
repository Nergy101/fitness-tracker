<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>System states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 860px; height: 844px; display: flex; gap: 80px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="width: 390px; height: 844px; flex-shrink: 0; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; display: flex; flex-direction: column">

<div role="status" style="padding: 52px 16px 10px 16px; background: rgba(234,179,8,0.9); color: #000000; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M3 3l18 18"></path></svg>
<span style="flex-grow: 1">Offline · 2 entries waiting to sync</span>
</div>

<div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; flex-grow: 1">

<div style="background: {{t.inv.bg}}; color: {{t.inv.fg}}; border-radius: 22px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"></path></svg>
<span style="flex-grow: 1; font-size: 14px; font-weight: 700">New version available</span>
<button style="height: 36px; padding: 0 14px; border-radius: 18px; border: none; background: {{accent}}; color: #1b1b24; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer">Reload</button>
</div>

<span style="font-size: 12px; font-weight: 700; color: {{t.muted}}; padding-top: 4px">Toasts</span>
<div role="status" style="background: {{t.surface}}; border-radius: 22px; padding: 10px 10px 10px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.12)">
<span style="width: 32px; height: 32px; border-radius: 16px; background: {{t.green.bg}}; color: {{t.green.fg}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 14px; font-weight: 800">Run logged · 5.2 km</span><span style="font-size: 12px; color: {{t.muted}}">Streak now 13 days</span></span>
<button style="height: 36px; padding: 0 12px; border-radius: 18px; border: none; background: {{t.field}}; color: {{t.fg}}; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer">Undo</button>
</div>
<div role="status" style="background: {{t.surface}}; border-radius: 22px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.12)">
<span style="width: 32px; height: 32px; border-radius: 16px; background: {{t.orange.bg}}; color: {{t.orange.fg}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l2 2"></path></svg></span>
<span style="flex-grow: 1; font-size: 14px; font-weight: 700">Ride queued for sync</span>
</div>
<div role="alert" style="background: {{t.red.bg}}; color: {{t.red.fg}}; border-radius: 22px; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>
<span style="flex-grow: 1; font-size: 14px; font-weight: 700">Failed to save boxing workout</span>
<button style="height: 32px; padding: 0 10px; border-radius: 16px; border: none; background: {{t.red.chip}}; color: {{t.red.fg}}; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer">Retry</button>
</div>

<span style="font-size: 12px; font-weight: 700; color: {{t.muted}}; padding-top: 4px">Confirm</span>
<div role="alertdialog" aria-label="Delete workout?" style="background: {{t.surface}}; border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 18px; font-weight: 800">Delete "Tabata core"?</span>
<span style="font-size: 14px; color: {{t.muted}}">Logged sessions stay in History.</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button style="height: 48px; border-radius: 24px; border: none; background: {{t.field}}; color: {{t.fg}}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Cancel</button>
<button style="height: 48px; border-radius: 24px; border: none; background: {{t.red.bg}}; color: {{t.red.fg}}; font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer">Delete</button>
</div>
</div>

<span style="font-size: 12px; font-weight: 700; color: {{t.muted}}; padding-top: 4px">Empty &amp; loading</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="background: {{t.surface}}; border-radius: 26px; padding: 14px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start">
<span style="width: 40px; height: 40px; border-radius: 20px; background: {{t.field}}; color: {{t.muted}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></span>
<span style="font-size: 15px; font-weight: 800">No sessions yet</span>
<button style="height: 36px; padding: 0 12px; border-radius: 18px; border: none; background: {{accent}}; color: #1b1b24; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer">Log your first</button>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="grid-column: span 2; height: 56px; border-radius: 18px; background: {{t.track}}"></div>
<div style="height: 56px; border-radius: 18px; background: {{t.track}}"></div>
<div style="height: 56px; border-radius: 18px; background: {{t.track}}"></div>
</div>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd23f","options":["#ffd23f","#7ee0a8","#ff9d6b","#9fc5ff"]},"$preview":{"width":860,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var L = { bg: '#f1f2f6', surface: '#ffffff', fg: '#1b1b24', muted: '#5a5b6b', track: '#e9eaef', field: '#f1f2f6', scrim: 'rgba(20,20,32,0.5)',
inv: { bg: '#1b1b24', fg: '#ffffff', muted: '#b8b9c8' }, nav: { bg: '#1b1b24', icon: '#b8b9c8' },
orange: { bg: '#ffd9bf', fg: '#5a2106', icon: '#c2410c', chip: '#ffffff' }, blue: { bg: '#d6e8ff', fg: '#0b2a52', bar: '#2563c9', track: '#ffffff' },
purple: { bg: '#e7e0ff', fg: '#33206e', chip: '#ffffff' }, sky: { bg: '#d4f0ff', fg: '#0b3a52', chip: '#ffffff' },
green: { bg: '#d6f5e0', fg: '#0e4425', chip: '#ffffff' }, red: { bg: '#ffdede', fg: '#6b1616', chip: '#ffffff' } };
var D = { bg: '#111118', surface: '#1c1c26', fg: '#f1f1f6', muted: '#a3a4b5', track: '#2c2c3a', field: '#262633', scrim: 'rgba(0,0,0,0.62)',
inv: { bg: '#f1f1f6', fg: '#111118', muted: '#5a5b6b' }, nav: { bg: '#26263a', icon: '#a3a4b5' },
orange: { bg: '#3a1f10', fg: '#ffd9bf', icon: '#fb923c', chip: '#4d2a15' }, blue: { bg: '#13263f', fg: '#d6e8ff', bar: '#60a5fa', track: '#22395a' },
purple: { bg: '#251c44', fg: '#e7e0ff', chip: '#33285a' }, sky: { bg: '#0f2a36', fg: '#bfe8fb', chip: '#17394a' },
green: { bg: '#10291a', fg: '#c4f5d4', chip: '#173a25' }, red: { bg: '#2e1414', fg: '#ffd0d0', chip: '#451e1e' } };
return { themes: [L, D], accent: this.props.accent ?? '#ffd23f' };
}
}
</script>
</body>
</html>
