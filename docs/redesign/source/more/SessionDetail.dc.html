<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Session detail sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 860px; height: 844px; display: flex; gap: 80px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="width: 390px; height: 844px; flex-shrink: 0; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Bricolage Grotesque', system-ui, sans-serif">

<div style="position: absolute; inset: 0; padding: 60px 16px 0 16px; display: flex; flex-direction: column; gap: 10px">
<div style="height: 44px"></div>
<div style="height: 270px; border-radius: 26px; background: {{t.surface}}"></div>
</div>
<div style="position: absolute; inset: 0; background: {{t.scrim}}"></div>

<div role="dialog" aria-label="Session detail" style="position: absolute; left: 0; right: 0; bottom: 0; top: 68px; background: {{t.surface}}; border-radius: 32px 32px 0 0; padding: 10px 20px 30px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<div style="width: 40px; height: 5px; border-radius: 3px; background: {{t.track}}; align-self: center"></div>

<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 48px; height: 48px; border-radius: 24px; background: {{t.orange.bg}}; color: {{t.orange.fg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg></span>
<div style="display: flex; flex-direction: column; flex-grow: 1">
<h2 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1">Full body A</h2>
<button title="Edit date/time" style="align-self: flex-start; border: none; background: transparent; padding: 2px 0; color: {{t.muted}}; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 4px; cursor: pointer">Sun 5 Oct · 07:42<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
</div>
<button aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: {{t.track}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<label style="background: {{t.field}}; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 2px; box-shadow: inset 0 0 0 2px {{t.fg}}"><span style="font-size: 11px; color: {{t.muted}}">Minutes</span><input type="text" inputmode="numeric" value="32" aria-label="Session duration minutes" style="width: 100%; border: none; background: transparent; font-family: inherit; font-size: 20px; font-weight: 800; color: {{t.fg}}; outline: none; padding: 0"></label>
<div style="background: {{t.field}}; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: {{t.muted}}">Kcal</span><span style="font-size: 20px; font-weight: 800">240</span></div>
<div style="background: {{t.field}}; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: {{t.muted}}">Exercises</span><span style="font-size: 20px; font-weight: 800">8</span></div>
<div style="background: {{t.field}}; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 11px; color: {{t.muted}}">Sets</span><span style="font-size: 20px; font-weight: 800">22</span></div>
</div>

<div style="display: flex; flex-direction: column; border-radius: 22px; background: {{t.field}}; padding: 4px 14px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 10px; height: 50px; border-bottom: 1px solid {{t.track}}">
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">{{r.name}}</span><span style="font-size: 12px; color: {{t.muted}}">{{r.meta}}</span></span>
<span style="font-size: 14px; font-weight: 800">{{r.sets}}</span>
</div>
</sc-for>
<span style="height: 40px; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: {{t.muted}}">+ 3 more</span>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; border-radius: 22px; background: {{t.field}}; padding: 12px 14px"><span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">Notes</span>
<textarea rows="2" aria-label="Session notes" placeholder="Add notes..." style="border: none; background: transparent; font-family: inherit; font-size: 15px; color: {{t.fg}}; outline: none; resize: none; padding: 0">Felt strong, bumped rows to 16 kg.</textarea></label>

<div style="flex-grow: 1"></div>
<div style="display: flex; gap: 10px">
<button aria-label="Delete session" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: {{t.red.bg}}; color: {{t.red.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"></path></svg></button>
<button style="height: 56px; padding: 0 18px; border-radius: 28px; border: none; background: {{t.field}}; color: {{t.fg}}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Repeat</button>
<button style="flex-grow: 1; height: 56px; border-radius: 28px; border: none; background: {{accent}}; color: #1b1b24; font-family: inherit; font-size: 17px; font-weight: 800; cursor: pointer">Save changes</button>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd23f","options":["#ffd23f","#7ee0a8","#ff9d6b","#9fc5ff"]},"$preview":{"width":860,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var L = { bg: '#f1f2f6', surface: '#ffffff', fg: '#1b1b24', muted: '#5a5b6b', track: '#e9eaef', field: '#f1f2f6', scrim: 'rgba(20,20,32,0.5)',
inv: { bg: '#1b1b24', fg: '#ffffff', muted: '#b8b9c8' }, nav: { bg: '#1b1b24', icon: '#b8b9c8' },
orange: { bg: '#ffd9bf', fg: '#5a2106', icon: '#c2410c', chip: '#ffffff' }, blue: { bg: '#d6e8ff', fg: '#0b2a52', bar: '#2563c9', track: '#ffffff' },
purple: { bg: '#e7e0ff', fg: '#33206e', chip: '#ffffff' }, sky: { bg: '#d4f0ff', fg: '#0b3a52', chip: '#ffffff' },
green: { bg: '#d6f5e0', fg: '#0e4425', chip: '#ffffff' }, red: { bg: '#ffdede', fg: '#6b1616', chip: '#ffffff' } };
var D = { bg: '#111118', surface: '#1c1c26', fg: '#f1f1f6', muted: '#a3a4b5', track: '#2c2c3a', field: '#262633', scrim: 'rgba(0,0,0,0.62)',
inv: { bg: '#f1f1f6', fg: '#111118', muted: '#5a5b6b' }, nav: { bg: '#26263a', icon: '#a3a4b5' },
orange: { bg: '#3a1f10', fg: '#ffd9bf', icon: '#fb923c', chip: '#4d2a15' }, blue: { bg: '#13263f', fg: '#d6e8ff', bar: '#60a5fa', track: '#22395a' },
purple: { bg: '#251c44', fg: '#e7e0ff', chip: '#33285a' }, sky: { bg: '#0f2a36', fg: '#bfe8fb', chip: '#17394a' },
green: { bg: '#10291a', fg: '#c4f5d4', chip: '#173a25' }, red: { bg: '#2e1414', fg: '#ffd0d0', chip: '#451e1e' } };
var rows = [
{ name: 'Squats', meta: 'Bodyweight · RPE 7', sets: '3 × 15' },
{ name: 'Push-ups', meta: 'Bodyweight · RPE 8', sets: '3 × 12' },
{ name: 'Bent-over rows', meta: '16 kg · RPE 8', sets: '3 × 12' },
{ name: 'Lunges', meta: '2 × 8 kg · RPE 7', sets: '3 × 10' },
{ name: 'Plank', meta: 'Hold', sets: '3 × 60 s' }
];
return { themes: [L, D], rows: rows, accent: this.props.accent ?? '#ffd23f' };
}
}
</script>
</body>
</html>
