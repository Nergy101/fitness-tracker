<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout runner — exercise</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 860px; height: 844px; display: flex; gap: 80px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="width: 390px; height: 844px; flex-shrink: 0; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; padding: 68px 16px 30px 16px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; align-items: center; gap: 10px">
<button aria-label="Stop workout" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: {{t.surface}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 12px; font-weight: 700"><span>Full body A</span><span style="color: {{t.muted}}">3 of 8 · 21:40 left</span></div>
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 3px">
<div style="height: 6px; border-radius: 3px; background: {{t.fg}}"></div>
<div style="height: 6px; border-radius: 3px; background: {{t.fg}}"></div>
<div style="height: 6px; border-radius: 3px; background: {{accent}}"></div>
<div style="height: 6px; border-radius: 3px; background: {{t.track}}"></div>
<div style="height: 6px; border-radius: 3px; background: {{t.track}}"></div>
<div style="height: 6px; border-radius: 3px; background: {{t.track}}"></div>
<div style="height: 6px; border-radius: 3px; background: {{t.track}}"></div>
<div style="height: 6px; border-radius: 3px; background: {{t.track}}"></div>
</div>
</div>
<button aria-label="Swap exercise" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: {{t.surface}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"></path></svg></button>
</div>

<div style="background: {{t.orange.bg}}; color: {{t.orange.fg}}; border-radius: 28px; padding: 14px; display: flex; gap: 14px; align-items: center">
<div style="width: 92px; height: 92px; border-radius: 20px; background: {{t.orange.chip}}; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; text-align: center; flex-shrink: 0">[Exercise<br>image]</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; font-weight: 700">Set 2 of 3</span>
<span style="font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">Bent-over rows</span>
<span style="font-size: 13px">Back · Dumbbell</span>
</div>
</div>

<div style="position: relative; width: 210px; height: 210px; align-self: center">
<svg width="210" height="210" viewBox="0 0 210 210"><circle cx="105" cy="105" r="92" fill="none" stroke="{{t.track}}" stroke-width="16"></circle><circle cx="105" cy="105" r="92" fill="none" stroke="{{accent}}" stroke-width="16" stroke-linecap="round" stroke-dasharray="411 578" transform="rotate(-90 105 105)"></circle></svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 60px; font-weight: 800; letter-spacing: -0.04em; line-height: 1">0:32</span><span style="font-size: 13px; color: {{t.muted}}">of 0:45</span></div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="background: {{t.surface}}; border-radius: 22px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">Reps</span>
<div style="display: flex; align-items: center; justify-content: space-between">
<button aria-label="Fewer reps" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: {{t.field}}; color: {{t.fg}}; font-family: inherit; font-size: 20px; font-weight: 800; cursor: pointer">−</button>
<label><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Reps</span><input type="text" inputmode="numeric" value="12" style="width: 44px; border: none; background: transparent; text-align: center; font-family: inherit; font-size: 26px; font-weight: 800; color: {{t.fg}}; outline: none; padding: 0"></label>
<button aria-label="More reps" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: {{t.field}}; color: {{t.fg}}; font-family: inherit; font-size: 20px; font-weight: 800; cursor: pointer">+</button>
</div>
</div>
<div style="background: {{t.surface}}; border-radius: 22px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">Weight (kg)</span>
<div style="display: flex; align-items: center; justify-content: space-between">
<button aria-label="Less weight" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: {{t.field}}; color: {{t.fg}}; font-family: inherit; font-size: 20px; font-weight: 800; cursor: pointer">−</button>
<label><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Weight in kg</span><input type="text" inputmode="decimal" value="16" style="width: 52px; border: none; background: transparent; text-align: center; font-family: inherit; font-size: 26px; font-weight: 800; color: {{t.fg}}; outline: none; padding: 0"></label>
<button aria-label="More weight" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: {{t.field}}; color: {{t.fg}}; font-family: inherit; font-size: 20px; font-weight: 800; cursor: pointer">+</button>
</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 6px">
<span style="font-size: 12px; font-weight: 700; color: {{t.muted}}; width: 36px">RPE</span>
<button style="flex-grow: 1; height: 40px; border-radius: 14px; border: none; background: {{t.surface}}; color: {{t.fg}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">6</button>
<button style="flex-grow: 1; height: 40px; border-radius: 14px; border: none; background: {{t.surface}}; color: {{t.fg}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">7</button>
<button style="flex-grow: 1; height: 40px; border-radius: 14px; border: none; background: {{t.inv.bg}}; color: {{t.inv.fg}}; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer">8</button>
<button style="flex-grow: 1; height: 40px; border-radius: 14px; border: none; background: {{t.surface}}; color: {{t.fg}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">9</button>
<button style="flex-grow: 1; height: 40px; border-radius: 14px; border: none; background: {{t.surface}}; color: {{t.fg}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">10</button>
<button aria-label="Set notes" style="width: 40px; height: 40px; border-radius: 14px; border: none; background: {{t.surface}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>
</div>

<div style="flex-grow: 1"></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
<button aria-label="Undo last set" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: {{t.surface}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path></svg></button>
<button style="height: 72px; padding: 0 30px; border-radius: 36px; border: none; background: {{accent}}; color: #1b1b24; font-family: inherit; font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 10px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Log set</button>
<button aria-label="Pause" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: {{t.surface}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg></button>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd23f","options":["#ffd23f","#7ee0a8","#ff9d6b","#9fc5ff"]},"$preview":{"width":860,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var L = { bg: '#f1f2f6', surface: '#ffffff', fg: '#1b1b24', muted: '#5a5b6b', track: '#e9eaef', field: '#f1f2f6', scrim: 'rgba(20,20,32,0.5)',
inv: { bg: '#1b1b24', fg: '#ffffff', muted: '#b8b9c8' }, nav: { bg: '#1b1b24', icon: '#b8b9c8' },
orange: { bg: '#ffd9bf', fg: '#5a2106', icon: '#c2410c', chip: '#ffffff' }, blue: { bg: '#d6e8ff', fg: '#0b2a52', bar: '#2563c9', track: '#ffffff' },
purple: { bg: '#e7e0ff', fg: '#33206e', chip: '#ffffff' }, sky: { bg: '#d4f0ff', fg: '#0b3a52', chip: '#ffffff' },
green: { bg: '#d6f5e0', fg: '#0e4425', chip: '#ffffff' }, red: { bg: '#ffdede', fg: '#6b1616', chip: '#ffffff' } };
var D = { bg: '#111118', surface: '#1c1c26', fg: '#f1f1f6', muted: '#a3a4b5', track: '#2c2c3a', field: '#262633', scrim: 'rgba(0,0,0,0.62)',
inv: { bg: '#f1f1f6', fg: '#111118', muted: '#5a5b6b' }, nav: { bg: '#26263a', icon: '#a3a4b5' },
orange: { bg: '#3a1f10', fg: '#ffd9bf', icon: '#fb923c', chip: '#4d2a15' }, blue: { bg: '#13263f', fg: '#d6e8ff', bar: '#60a5fa', track: '#22395a' },
purple: { bg: '#251c44', fg: '#e7e0ff', chip: '#33285a' }, sky: { bg: '#0f2a36', fg: '#bfe8fb', chip: '#17394a' },
green: { bg: '#10291a', fg: '#c4f5d4', chip: '#173a25' }, red: { bg: '#2e1414', fg: '#ffd0d0', chip: '#451e1e' } };
return { themes: [L, D], accent: this.props.accent ?? '#ffd23f' };
}
}
</script>
</body>
</html>
