<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Onboarding — quick setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 860px; height: 844px; display: flex; gap: 80px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div role="dialog" aria-label="Welcome tour" style="width: 390px; height: 844px; flex-shrink: 0; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; padding: 64px 20px 34px 20px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; gap: 6px"><span style="width: 24px; height: 6px; border-radius: 3px; background: {{t.fg}}"></span><span style="width: 24px; height: 6px; border-radius: 3px; background: {{t.fg}}"></span><span style="width: 24px; height: 6px; border-radius: 3px; background: {{t.track}}"></span></div>
<button style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: transparent; color: {{t.muted}}; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Skip</button>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05">Quick setup</h1>
<p style="margin: 0; font-size: 15px; color: {{t.muted}}">Pick what you track. We'll put those first on Today.</p>
</div>

<div role="group" aria-label="Activities you do" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<button aria-pressed="true" style="grid-column: span 2; height: 92px; border-radius: 24px; border: none; background: {{t.sky.bg}}; color: {{t.sky.fg}}; font-family: inherit; font-size: 17px; font-weight: 800; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 14px; box-sizing: border-box; cursor: pointer; box-shadow: inset 0 0 0 2.5px {{t.sky.fg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Running</button>
<button aria-pressed="true" style="height: 92px; border-radius: 24px; border: none; background: {{t.orange.bg}}; color: {{t.orange.fg}}; font-family: inherit; font-size: 15px; font-weight: 800; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 14px; box-sizing: border-box; cursor: pointer; box-shadow: inset 0 0 0 2.5px {{t.orange.fg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Workouts</button>
<button aria-pressed="false" style="height: 92px; border-radius: 24px; border: none; background: {{t.surface}}; color: {{t.fg}}; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; padding: 14px; box-sizing: border-box; cursor: pointer">Walking</button>
<button aria-pressed="true" style="height: 92px; border-radius: 24px; border: none; background: {{t.purple.bg}}; color: {{t.purple.fg}}; font-family: inherit; font-size: 15px; font-weight: 800; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; padding: 14px; box-sizing: border-box; cursor: pointer; box-shadow: inset 0 0 0 2.5px {{t.purple.fg}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>Cycling</button>
<button aria-pressed="false" style="height: 92px; border-radius: 24px; border: none; background: {{t.surface}}; color: {{t.fg}}; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; padding: 14px; box-sizing: border-box; cursor: pointer">Boxing</button>
</div>

<div style="background: {{t.surface}}; border-radius: 26px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">Current weight (kg)</span><input type="text" inputmode="decimal" placeholder="e.g. 75.0" style="height: 48px; box-sizing: border-box; border-radius: 16px; border: none; background: {{t.field}}; padding: 0 14px; font-family: inherit; font-size: 17px; font-weight: 700; color: {{t.fg}}; outline: none"></label>
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: {{t.muted}}">Height (cm)</span><input type="text" inputmode="numeric" placeholder="e.g. 180" style="height: 48px; box-sizing: border-box; border-radius: 16px; border: none; background: {{t.field}}; padding: 0 14px; font-family: inherit; font-size: 17px; font-weight: 700; color: {{t.fg}}; outline: none"></label>
</div>
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 14px; font-weight: 700">Date format</span>
<div role="group" aria-label="Date format" style="display: flex; gap: 4px; padding: 4px; border-radius: 20px; background: {{t.field}}">
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: none; background: {{t.surface}}; color: {{t.fg}}; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer">D/M</button>
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: none; background: transparent; color: {{t.muted}}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">M/D</button>
</div>
</div>
</div>

<div style="flex-grow: 1"></div>
<button style="height: 56px; border-radius: 28px; border: none; background: {{accent}}; color: #1b1b24; font-family: inherit; font-size: 17px; font-weight: 800; cursor: pointer">Continue</button>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd23f","options":["#ffd23f","#7ee0a8","#ff9d6b","#9fc5ff"]},"$preview":{"width":860,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var L = { bg: '#f1f2f6', surface: '#ffffff', fg: '#1b1b24', muted: '#5a5b6b', track: '#e9eaef', field: '#f1f2f6', scrim: 'rgba(20,20,32,0.5)',
inv: { bg: '#1b1b24', fg: '#ffffff', muted: '#b8b9c8' }, nav: { bg: '#1b1b24', icon: '#b8b9c8' },
orange: { bg: '#ffd9bf', fg: '#5a2106', icon: '#c2410c', chip: '#ffffff' }, blue: { bg: '#d6e8ff', fg: '#0b2a52', bar: '#2563c9', track: '#ffffff' },
purple: { bg: '#e7e0ff', fg: '#33206e', chip: '#ffffff' }, sky: { bg: '#d4f0ff', fg: '#0b3a52', chip: '#ffffff' },
green: { bg: '#d6f5e0', fg: '#0e4425', chip: '#ffffff' }, red: { bg: '#ffdede', fg: '#6b1616', chip: '#ffffff' } };
var D = { bg: '#111118', surface: '#1c1c26', fg: '#f1f1f6', muted: '#a3a4b5', track: '#2c2c3a', field: '#262633', scrim: 'rgba(0,0,0,0.62)',
inv: { bg: '#f1f1f6', fg: '#111118', muted: '#5a5b6b' }, nav: { bg: '#26263a', icon: '#a3a4b5' },
orange: { bg: '#3a1f10', fg: '#ffd9bf', icon: '#fb923c', chip: '#4d2a15' }, blue: { bg: '#13263f', fg: '#d6e8ff', bar: '#60a5fa', track: '#22395a' },
purple: { bg: '#251c44', fg: '#e7e0ff', chip: '#33285a' }, sky: { bg: '#0f2a36', fg: '#bfe8fb', chip: '#17394a' },
green: { bg: '#10291a', fg: '#c4f5d4', chip: '#173a25' }, red: { bg: '#2e1414', fg: '#ffd0d0', chip: '#451e1e' } };
return { themes: [L, D], accent: this.props.accent ?? '#ffd23f' };
}
}
</script>
</body>
</html>
