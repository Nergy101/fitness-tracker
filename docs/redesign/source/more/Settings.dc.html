<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 860px; height: 844px; display: flex; gap: 80px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="width: 390px; height: 844px; flex-shrink: 0; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; padding: 60px 16px 0 16px; display: flex; flex-direction: column; gap: 10px">

<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
<h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em">Settings</h1>
<button aria-label="Close settings" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: {{t.surface}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div role="tablist" aria-label="Settings sections" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 24px; background: {{t.surface}}">
<button role="tab" aria-selected="true" style="height: 40px; border-radius: 20px; border: none; background: {{t.inv.bg}}; color: {{t.inv.fg}}; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer">General</button>
<button role="tab" aria-selected="false" style="height: 40px; border-radius: 20px; border: none; background: transparent; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Health</button>
<button role="tab" aria-selected="false" style="height: 40px; border-radius: 20px; border: none; background: transparent; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Credits</button>
</div>

<div style="background: {{t.surface}}; border-radius: 26px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; color: {{t.muted}}">Theme</span>
<div role="group" aria-label="Theme" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button style="height: 64px; border-radius: 18px; border: 2px solid {{t.track}}; background: #f1f2f6; color: #1b1b24; font-family: inherit; font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"></path></svg>Light</button>
<button style="height: 64px; border-radius: 18px; border: 2px solid {{t.track}}; background: #111118; color: #f1f1f6; font-family: inherit; font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"></path></svg>Dark</button>
<button style="height: 64px; border-radius: 18px; border: 2px solid {{t.fg}}; background: {{t.field}}; color: {{t.fg}}; font-family: inherit; font-size: 13px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>System</button>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 15px; font-weight: 700">Date format</span>
<div role="group" aria-label="Date format" style="display: flex; gap: 4px; padding: 4px; border-radius: 20px; background: {{t.field}}">
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: none; background: {{t.surface}}; color: {{t.fg}}; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer">D/M</button>
<button style="height: 34px; padding: 0 14px; border-radius: 17px; border: none; background: transparent; color: {{t.muted}}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">M/D</button>
</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">Voice cues</span><span style="font-size: 12px; color: {{t.muted}}">Announce exercises during workouts</span></span>
<button role="switch" aria-checked="true" aria-label="Voice cues" style="width: 52px; height: 30px; border-radius: 15px; border: none; background: {{t.green.fg}}; padding: 3px; display: flex; justify-content: flex-end; cursor: pointer"><span style="width: 24px; height: 24px; border-radius: 12px; background: {{t.surface}}"></span></button>
</div>
</div>

<div style="background: {{t.surface}}; border-radius: 26px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">Backups</span><span style="font-size: 12px; color: {{t.muted}}">Last: today 03:00 · 4 kept</span></span>
<button aria-label="Backup now" style="height: 36px; padding: 0 12px; border-radius: 18px; border: none; background: {{t.field}}; color: {{t.fg}}; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer">Back up now</button>
</div>
<div role="group" aria-label="Backup schedule" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 20px; background: {{t.field}}">
<button style="height: 34px; border-radius: 17px; border: none; background: transparent; color: {{t.muted}}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Off</button>
<button style="height: 34px; border-radius: 17px; border: none; background: {{t.surface}}; color: {{t.fg}}; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer">Daily</button>
<button style="height: 34px; border-radius: 17px; border: none; background: transparent; color: {{t.muted}}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Weekly</button>
</div>
</div>

<div style="background: {{t.surface}}; border-radius: 26px; padding: 4px 16px; display: flex; flex-direction: column">
<button style="height: 52px; border: none; border-bottom: 1px solid {{t.track}}; background: transparent; color: {{t.fg}}; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; padding: 0; cursor: pointer">Export data (CSV)<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
<button style="height: 52px; border: none; border-bottom: 1px solid {{t.track}}; background: transparent; color: {{t.fg}}; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; padding: 0; cursor: pointer">Add to Home Screen<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
<button style="height: 52px; border: none; background: transparent; color: {{t.fg}}; font-family: inherit; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; padding: 0; cursor: pointer">Share the app<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>

<span style="text-align: center; font-size: 12px; color: {{t.muted}}">FitnessTracker · v[VERSION]</span>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":860,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var L = { bg: '#f1f2f6', surface: '#ffffff', fg: '#1b1b24', muted: '#5a5b6b', track: '#e9eaef', field: '#f1f2f6', scrim: 'rgba(20,20,32,0.5)',
inv: { bg: '#1b1b24', fg: '#ffffff', muted: '#b8b9c8' }, nav: { bg: '#1b1b24', icon: '#b8b9c8' },
orange: { bg: '#ffd9bf', fg: '#5a2106', icon: '#c2410c', chip: '#ffffff' }, blue: { bg: '#d6e8ff', fg: '#0b2a52', bar: '#2563c9', track: '#ffffff' },
purple: { bg: '#e7e0ff', fg: '#33206e', chip: '#ffffff' }, sky: { bg: '#d4f0ff', fg: '#0b3a52', chip: '#ffffff' },
green: { bg: '#d6f5e0', fg: '#0e4425', chip: '#ffffff' }, red: { bg: '#ffdede', fg: '#6b1616', chip: '#ffffff' } };
var D = { bg: '#111118', surface: '#1c1c26', fg: '#f1f1f6', muted: '#a3a4b5', track: '#2c2c3a', field: '#262633', scrim: 'rgba(0,0,0,0.62)',
inv: { bg: '#f1f1f6', fg: '#111118', muted: '#5a5b6b' }, nav: { bg: '#26263a', icon: '#a3a4b5' },
orange: { bg: '#3a1f10', fg: '#ffd9bf', icon: '#fb923c', chip: '#4d2a15' }, blue: { bg: '#13263f', fg: '#d6e8ff', bar: '#60a5fa', track: '#22395a' },
purple: { bg: '#251c44', fg: '#e7e0ff', chip: '#33285a' }, sky: { bg: '#0f2a36', fg: '#bfe8fb', chip: '#17394a' },
green: { bg: '#10291a', fg: '#c4f5d4', chip: '#173a25' }, red: { bg: '#2e1414', fg: '#ffd0d0', chip: '#451e1e' } };
L.green.fg = '#1f8a4c';
D.green.fg = '#4ade80';
return { themes: [L, D] };
}
}
</script>
</body>
</html>
