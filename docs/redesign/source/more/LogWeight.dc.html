<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log weight and check-in sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 860px; height: 844px; display: flex; gap: 80px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="width: 390px; height: 844px; flex-shrink: 0; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Bricolage Grotesque', system-ui, sans-serif">

<div style="position: absolute; inset: 0; padding: 60px 16px 0 16px; display: flex; flex-direction: column; gap: 10px">
<div style="height: 44px"></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="grid-column: span 2; height: 150px; border-radius: 26px; background: {{t.purple.bg}}"></div>
<div style="height: 150px; border-radius: 26px; background: {{t.blue.bg}}"></div>
</div>
</div>
<div style="position: absolute; inset: 0; background: {{t.scrim}}"></div>

<div role="dialog" aria-label="Log weight" style="position: absolute; left: 0; right: 0; bottom: 0; top: 96px; background: {{t.surface}}; border-radius: 32px 32px 0 0; padding: 10px 20px 30px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<div style="width: 40px; height: 5px; border-radius: 3px; background: {{t.track}}; align-self: center"></div>

<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 44px; height: 44px; border-radius: 22px; background: {{t.purple.bg}}; color: {{t.purple.fg}}; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="4"></rect><path d="M8 9a5 5 0 0 1 8 0M12 9l1.5-2"></path></svg></span>
<h2 style="margin: 0; flex-grow: 1; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Morning weigh-in</h2>
<button aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: {{t.track}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="background: {{t.purple.bg}}; color: {{t.purple.fg}}; border-radius: 26px; padding: 16px 14px 12px 14px; display: flex; flex-direction: column; gap: 10px; align-items: center">
<div style="display: flex; align-items: center; justify-content: space-between; width: 100%">
<button aria-label="Minus 0.1 kg" style="width: 52px; height: 52px; border-radius: 26px; border: none; background: {{t.purple.chip}}; color: {{t.purple.fg}}; font-family: inherit; font-size: 24px; font-weight: 800; cursor: pointer">−</button>
<label style="display: flex; align-items: baseline; gap: 4px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Weight in kg</span><input type="text" inputmode="decimal" value="82.3" style="width: 140px; border: none; background: transparent; text-align: right; font-family: inherit; font-size: 60px; font-weight: 800; letter-spacing: -0.04em; color: {{t.purple.fg}}; outline: none; padding: 0"><span style="font-size: 18px; font-weight: 700">kg</span></label>
<button aria-label="Plus 0.1 kg" style="width: 52px; height: 52px; border-radius: 26px; border: none; background: {{t.purple.chip}}; color: {{t.purple.fg}}; font-family: inherit; font-size: 24px; font-weight: 800; cursor: pointer">+</button>
</div>
<div style="display: flex; align-items: flex-end; gap: 5px; height: 26px">
<span style="width: 2px; height: 10px; border-radius: 1px; background: currentColor; opacity: 0.4"></span>
<span style="width: 2px; height: 10px; border-radius: 1px; background: currentColor; opacity: 0.4"></span>
<span style="width: 2px; height: 18px; border-radius: 1px; background: currentColor; opacity: 0.6"></span>
<span style="width: 2px; height: 10px; border-radius: 1px; background: currentColor; opacity: 0.4"></span>
<span style="width: 2px; height: 10px; border-radius: 1px; background: currentColor; opacity: 0.4"></span>
<span style="width: 2px; height: 10px; border-radius: 1px; background: currentColor; opacity: 0.4"></span>
<span style="width: 2px; height: 10px; border-radius: 1px; background: currentColor; opacity: 0.4"></span>
<span style="width: 3px; height: 26px; border-radius: 2px; background: currentColor"></span>
<span style="width: 2px; height: 10px; border-radius: 1px; background: currentColor; opacity: 0.4"></span>
<span style="width: 2px; height: 10px; border-radius: 1px; background: currentColor; opacity: 0.4"></span>
<span style="width: 2px; height: 10px; border-radius: 1px; background: currentColor; opacity: 0.4"></span>
<span style="width: 2px; height: 10px; border-radius: 1px; background: currentColor; opacity: 0.4"></span>
<span style="width: 2px; height: 18px; border-radius: 1px; background: currentColor; opacity: 0.6"></span>
<span style="width: 2px; height: 10px; border-radius: 1px; background: currentColor; opacity: 0.4"></span>
<span style="width: 2px; height: 10px; border-radius: 1px; background: currentColor; opacity: 0.4"></span>
</div>
<span style="font-size: 13px; font-weight: 600">−0.1 kg since Friday · 4.3 kg to goal</span>
</div>

<div style="height: 1px; background: {{t.track}}"></div>

<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 17px; font-weight: 800">Also check in</span><span style="font-size: 12px; color: {{t.muted}}">1 = low · 5 = high</span></div>

<div style="display: grid; grid-template-columns: 60px repeat(5, minmax(0, 1fr)); gap: 6px; align-items: center">
<span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">Mood</span>
<button aria-label="Mood 1" style="height: 40px; border-radius: 14px; border: none; background: {{t.field}}; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">1</button>
<button aria-label="Mood 2" style="height: 40px; border-radius: 14px; border: none; background: {{t.field}}; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">2</button>
<button aria-label="Mood 3" style="height: 40px; border-radius: 14px; border: none; background: {{t.field}}; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">3</button>
<button aria-label="Mood 4" style="height: 40px; border-radius: 14px; border: none; background: {{t.green.bg}}; color: {{t.green.fg}}; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: inset 0 0 0 2px {{t.green.fg}}">4</button>
<button aria-label="Mood 5" style="height: 40px; border-radius: 14px; border: none; background: {{t.field}}; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">5</button>
<span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">Energy</span>
<button aria-label="Energy 1" style="height: 40px; border-radius: 14px; border: none; background: {{t.field}}; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">1</button>
<button aria-label="Energy 2" style="height: 40px; border-radius: 14px; border: none; background: {{t.field}}; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">2</button>
<button aria-label="Energy 3" style="height: 40px; border-radius: 14px; border: none; background: {{t.orange.bg}}; color: {{t.orange.fg}}; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: inset 0 0 0 2px {{t.orange.fg}}">3</button>
<button aria-label="Energy 4" style="height: 40px; border-radius: 14px; border: none; background: {{t.field}}; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">4</button>
<button aria-label="Energy 5" style="height: 40px; border-radius: 14px; border: none; background: {{t.field}}; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">5</button>
<span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">Stress</span>
<button aria-label="Stress 1" style="height: 40px; border-radius: 14px; border: none; background: {{t.field}}; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">1</button>
<button aria-label="Stress 2" style="height: 40px; border-radius: 14px; border: none; background: {{t.blue.bg}}; color: {{t.blue.fg}}; font-family: inherit; font-size: 14px; font-weight: 800; cursor: pointer; box-shadow: inset 0 0 0 2px {{t.blue.fg}}">2</button>
<button aria-label="Stress 3" style="height: 40px; border-radius: 14px; border: none; background: {{t.field}}; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">3</button>
<button aria-label="Stress 4" style="height: 40px; border-radius: 14px; border: none; background: {{t.field}}; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">4</button>
<button aria-label="Stress 5" style="height: 40px; border-radius: 14px; border: none; background: {{t.field}}; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">5</button>
<span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">Sleep</span>
<div style="grid-column: span 5; display: flex; align-items: center; justify-content: space-between; height: 40px; border-radius: 14px; background: {{t.field}}; padding: 0 4px">
<button aria-label="Less sleep" style="width: 40px; height: 32px; border-radius: 10px; border: none; background: {{t.surface}}; color: {{t.fg}}; font-family: inherit; font-size: 18px; font-weight: 800; cursor: pointer">−</button>
<span style="font-size: 16px; font-weight: 800">7.5 h</span>
<button aria-label="More sleep" style="width: 40px; height: 32px; border-radius: 10px; border: none; background: {{t.surface}}; color: {{t.fg}}; font-family: inherit; font-size: 18px; font-weight: 800; cursor: pointer">+</button>
</div>
</div>

<div style="flex-grow: 1"></div>
<button style="height: 56px; border-radius: 28px; border: none; background: {{accent}}; color: #1b1b24; font-family: inherit; font-size: 17px; font-weight: 800; cursor: pointer">Save weigh-in</button>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd23f","options":["#ffd23f","#7ee0a8","#ff9d6b","#9fc5ff"]},"$preview":{"width":860,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var L = { bg: '#f1f2f6', surface: '#ffffff', fg: '#1b1b24', muted: '#5a5b6b', track: '#e9eaef', field: '#f1f2f6', scrim: 'rgba(20,20,32,0.5)',
inv: { bg: '#1b1b24', fg: '#ffffff', muted: '#b8b9c8' }, nav: { bg: '#1b1b24', icon: '#b8b9c8' },
orange: { bg: '#ffd9bf', fg: '#5a2106', icon: '#c2410c', chip: '#ffffff' }, blue: { bg: '#d6e8ff', fg: '#0b2a52', bar: '#2563c9', track: '#ffffff' },
purple: { bg: '#e7e0ff', fg: '#33206e', chip: '#ffffff' }, sky: { bg: '#d4f0ff', fg: '#0b3a52', chip: '#ffffff' },
green: { bg: '#d6f5e0', fg: '#0e4425', chip: '#ffffff' }, red: { bg: '#ffdede', fg: '#6b1616', chip: '#ffffff' } };
var D = { bg: '#111118', surface: '#1c1c26', fg: '#f1f1f6', muted: '#a3a4b5', track: '#2c2c3a', field: '#262633', scrim: 'rgba(0,0,0,0.62)',
inv: { bg: '#f1f1f6', fg: '#111118', muted: '#5a5b6b' }, nav: { bg: '#26263a', icon: '#a3a4b5' },
orange: { bg: '#3a1f10', fg: '#ffd9bf', icon: '#fb923c', chip: '#4d2a15' }, blue: { bg: '#13263f', fg: '#d6e8ff', bar: '#60a5fa', track: '#22395a' },
purple: { bg: '#251c44', fg: '#e7e0ff', chip: '#33285a' }, sky: { bg: '#0f2a36', fg: '#bfe8fb', chip: '#17394a' },
green: { bg: '#10291a', fg: '#c4f5d4', chip: '#173a25' }, red: { bg: '#2e1414', fg: '#ffd0d0', chip: '#451e1e' } };
return { themes: [L, D], accent: this.props.accent ?? '#ffd23f' };
}
}
</script>
</body>
</html>
