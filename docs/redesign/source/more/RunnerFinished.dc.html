<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout runner — finished</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 860px; height: 844px; display: flex; gap: 80px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="width: 390px; height: 844px; flex-shrink: 0; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; padding: 68px 16px 30px 16px; display: flex; flex-direction: column; gap: 10px">

<div style="background: {{accent}}; color: #1b1b24; border-radius: 30px; padding: 20px; display: flex; flex-direction: column; gap: 6px">
<div style="width: 52px; height: 52px; border-radius: 26px; background: #1b1b24; color: {{accent}}; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></div>
<span style="font-size: 36px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin-top: 8px">Workout done</span>
<span style="font-size: 15px; font-weight: 600">Full body A · Tue 7 Oct</span>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="height: 84px; box-sizing: border-box; background: {{t.surface}}; border-radius: 22px; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between"><span style="font-size: 12px; color: {{t.muted}}">Duration</span><span style="font-size: 24px; font-weight: 800">32:10</span></div>
<div style="height: 84px; box-sizing: border-box; background: {{t.surface}}; border-radius: 22px; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between"><span style="font-size: 12px; color: {{t.muted}}">Sets</span><span style="font-size: 24px; font-weight: 800">22</span></div>
<div style="height: 84px; box-sizing: border-box; background: {{t.surface}}; border-radius: 22px; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between"><span style="font-size: 12px; color: {{t.muted}}">Kcal</span><span style="font-size: 24px; font-weight: 800">240</span></div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="background: {{t.orange.bg}}; color: {{t.orange.fg}}; border-radius: 22px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 700">Streak</span>
<span style="font-size: 22px; font-weight: 800">13 days</span>
<span style="font-size: 12px">+1 today</span>
</div>
<div style="background: {{t.purple.bg}}; color: {{t.purple.fg}}; border-radius: 22px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 700">New best</span>
<span style="font-size: 22px; font-weight: 800">Rows 16 kg</span>
<span style="font-size: 12px">was 14 kg</span>
</div>
</div>

<div style="background: {{t.surface}}; border-radius: 22px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; color: {{t.muted}}">How did it feel?</span>
<div role="group" aria-label="Session feel" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
<button style="height: 44px; border-radius: 14px; border: none; background: {{t.field}}; color: {{t.fg}}; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer">Easy</button>
<button style="height: 44px; border-radius: 14px; border: none; background: {{t.field}}; color: {{t.fg}}; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer">Light</button>
<button style="height: 44px; border-radius: 14px; border: none; background: {{t.field}}; color: {{t.fg}}; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer">Solid</button>
<button style="height: 44px; border-radius: 14px; border: none; background: {{t.inv.bg}}; color: {{t.inv.fg}}; font-family: inherit; font-size: 12px; font-weight: 800; cursor: pointer">Hard</button>
<button style="height: 44px; border-radius: 14px; border: none; background: {{t.field}}; color: {{t.fg}}; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer">Max</button>
</div>
</div>

<label style="display: flex; flex-direction: column; gap: 6px; background: {{t.surface}}; border-radius: 22px; padding: 12px 14px"><span style="font-size: 13px; font-weight: 700; color: {{t.muted}}">Session notes</span>
<textarea rows="2" placeholder="Anything worth remembering?" style="border: none; background: transparent; font-family: inherit; font-size: 16px; color: {{t.fg}}; outline: none; resize: none; padding: 0"></textarea></label>

<div style="flex-grow: 1"></div>
<div style="display: flex; gap: 10px">
<button style="height: 56px; padding: 0 20px; border-radius: 28px; border: none; background: {{t.surface}}; color: {{t.fg}}; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">Discard</button>
<button style="flex-grow: 1; height: 56px; border-radius: 28px; border: none; background: {{t.inv.bg}}; color: {{t.inv.fg}}; font-family: inherit; font-size: 17px; font-weight: 800; cursor: pointer">Save session</button>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ffd23f","options":["#ffd23f","#7ee0a8","#ff9d6b","#9fc5ff"]},"$preview":{"width":860,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var L = { bg: '#f1f2f6', surface: '#ffffff', fg: '#1b1b24', muted: '#5a5b6b', track: '#e9eaef', field: '#f1f2f6', scrim: 'rgba(20,20,32,0.5)',
inv: { bg: '#1b1b24', fg: '#ffffff', muted: '#b8b9c8' }, nav: { bg: '#1b1b24', icon: '#b8b9c8' },
orange: { bg: '#ffd9bf', fg: '#5a2106', icon: '#c2410c', chip: '#ffffff' }, blue: { bg: '#d6e8ff', fg: '#0b2a52', bar: '#2563c9', track: '#ffffff' },
purple: { bg: '#e7e0ff', fg: '#33206e', chip: '#ffffff' }, sky: { bg: '#d4f0ff', fg: '#0b3a52', chip: '#ffffff' },
green: { bg: '#d6f5e0', fg: '#0e4425', chip: '#ffffff' }, red: { bg: '#ffdede', fg: '#6b1616', chip: '#ffffff' } };
var D = { bg: '#111118', surface: '#1c1c26', fg: '#f1f1f6', muted: '#a3a4b5', track: '#2c2c3a', field: '#262633', scrim: 'rgba(0,0,0,0.62)',
inv: { bg: '#f1f1f6', fg: '#111118', muted: '#5a5b6b' }, nav: { bg: '#26263a', icon: '#a3a4b5' },
orange: { bg: '#3a1f10', fg: '#ffd9bf', icon: '#fb923c', chip: '#4d2a15' }, blue: { bg: '#13263f', fg: '#d6e8ff', bar: '#60a5fa', track: '#22395a' },
purple: { bg: '#251c44', fg: '#e7e0ff', chip: '#33285a' }, sky: { bg: '#0f2a36', fg: '#bfe8fb', chip: '#17394a' },
green: { bg: '#10291a', fg: '#c4f5d4', chip: '#173a25' }, red: { bg: '#2e1414', fg: '#ffd0d0', chip: '#451e1e' } };
return { themes: [L, D], accent: this.props.accent ?? '#ffd23f' };
}
}
</script>
</body>
</html>
