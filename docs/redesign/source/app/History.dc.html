<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>History</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; padding: 60px 16px 0 16px; display: flex; flex-direction: column; gap: 10px">

<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
<h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05">History</h1>
<div style="display: flex; gap: 8px">
<button aria-label="Search sessions" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: {{t.surface}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></button>
<button aria-label="Filter by activity" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: {{t.surface}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button>
</div>
</div>

<div style="background: {{t.surface}}; border-radius: 26px; padding: 12px 14px 14px 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center">
<button aria-label="Previous month" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: {{t.track}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<span style="font-size: 17px; font-weight: 800">October 2026</span>
<button aria-label="Next month" style="width: 36px; height: 36px; border-radius: 18px; border: none; background: {{t.track}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; font-size: 11px; font-weight: 600; color: {{t.muted}}; text-align: center"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
<div style="{{c.style}}">{{c.n}}</div>
</sc-for>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="height: 72px; box-sizing: border-box; background: {{t.orange.bg}}; color: {{t.orange.fg}}; border-radius: 22px; padding: 10px 14px; display: flex; flex-direction: column; justify-content: space-between"><span style="font-size: 12px; font-weight: 600">Sessions</span><span style="font-size: 22px; font-weight: 800">18</span></div>
<div style="height: 72px; box-sizing: border-box; background: {{t.sky.bg}}; color: {{t.sky.fg}}; border-radius: 22px; padding: 10px 14px; display: flex; flex-direction: column; justify-content: space-between"><span style="font-size: 12px; font-weight: 600">Total time</span><span style="font-size: 22px; font-weight: 800">9.4 h</span></div>
<div style="height: 72px; box-sizing: border-box; background: {{t.purple.bg}}; color: {{t.purple.fg}}; border-radius: 22px; padding: 10px 14px; display: flex; flex-direction: column; justify-content: space-between"><span style="font-size: 12px; font-weight: 600">Active kcal</span><span style="font-size: 22px; font-weight: 800">4,120</span></div>
</div>

<div style="background: {{t.surface}}; border-radius: 26px; padding: 10px 14px 4px 14px; display: flex; flex-direction: column">
<span style="font-size: 12px; font-weight: 700; color: {{t.muted}}; padding: 2px 0">Mon 6 Oct</span>
<div style="display: flex; align-items: center; gap: 12px; height: 54px">
<span style="width: 36px; height: 36px; border-radius: 18px; background: {{t.green.bg}}; color: {{t.green.fg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"></circle><path d="M10 21l2-6 2 2v4M9 13l1-4 3 1 2 3"></path></svg></span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 700">Walk · 3.1 km</span><span style="font-size: 12px; color: {{t.muted}}">38 min · 120 kcal</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</div>
<div style="height: 1px; background: {{t.track}}"></div>
<span style="font-size: 12px; font-weight: 700; color: {{t.muted}}; padding: 8px 0 2px 0">Sun 5 Oct</span>
<div style="display: flex; align-items: center; gap: 12px; height: 54px">
<span style="width: 36px; height: 36px; border-radius: 18px; background: {{t.sky.bg}}; color: {{t.sky.fg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4" r="2"></circle><path d="M8 21l3-6 3 2v5M6 12l3-4 4 1 3 3 3 1"></path></svg></span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 700">Run · 5.2 km</span><span style="font-size: 12px; color: {{t.muted}}">28 min · 5:23 /km · 410 kcal</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</div>
<div style="display: flex; align-items: center; gap: 12px; height: 54px">
<span style="width: 36px; height: 36px; border-radius: 18px; background: {{t.orange.bg}}; color: {{t.orange.fg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg></span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 700">Full body A</span><span style="font-size: 12px; color: {{t.muted}}">32 min · 8 exercises · 240 kcal</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</div>
</div>

<nav aria-label="Main" style="position: absolute; left: 24px; right: 24px; bottom: 26px; height: 64px; border-radius: 32px; background: {{t.nav.bg}}; padding: 8px; box-sizing: border-box; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; align-items: center">
<button aria-label="Today" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{t.nav.icon}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
<button aria-label="Exercises" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{t.nav.icon}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg></button>
<button aria-label="Health" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{t.nav.icon}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-4 3 8 2-4h7"></path></svg></button>
<button aria-label="History" style="height: 48px; border-radius: 24px; border: none; background: {{accent}}; color: #1b1b24; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></button>
<button aria-label="Stats" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{t.nav.icon}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#ffd23f","options":["#ffd23f","#7ee0a8","#ff9d6b","#9fc5ff"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var dark = this.props.dark ?? false;
var light = {
bg: '#f1f2f6', surface: '#ffffff', fg: '#1b1b24', muted: '#5a5b6b', track: '#e9eaef',
inv: { bg: '#1b1b24', fg: '#ffffff', muted: '#b8b9c8' },
nav: { bg: '#1b1b24', icon: '#b8b9c8' },
orange: { bg: '#ffd9bf', fg: '#5a2106', icon: '#c2410c', chip: '#ffffff' },
blue: { bg: '#d6e8ff', fg: '#0b2a52', bar: '#2563c9', track: '#ffffff' },
purple: { bg: '#e7e0ff', fg: '#33206e', chip: '#ffffff' },
sky: { bg: '#d4f0ff', fg: '#0b3a52', chip: '#ffffff' },
green: { bg: '#d6f5e0', fg: '#0e4425', chip: '#ffffff' },
red: { bg: '#ffdede', fg: '#6b1616', chip: '#ffffff' }
};
var darkT = {
bg: '#111118', surface: '#1c1c26', fg: '#f1f1f6', muted: '#a3a4b5', track: '#2c2c3a',
inv: { bg: '#2a2a3a', fg: '#ffffff', muted: '#b8b9c8' },
nav: { bg: '#26263a', icon: '#a3a4b5' },
orange: { bg: '#3a1f10', fg: '#ffd9bf', icon: '#fb923c', chip: '#4d2a15' },
blue: { bg: '#13263f', fg: '#d6e8ff', bar: '#60a5fa', track: '#22395a' },
purple: { bg: '#251c44', fg: '#e7e0ff', chip: '#33285a' },
sky: { bg: '#0f2a36', fg: '#bfe8fb', chip: '#17394a' },
green: { bg: '#10291a', fg: '#c4f5d4', chip: '#173a25' },
red: { bg: '#2e1414', fg: '#ffd0d0', chip: '#451e1e' }
};
var t = dark ? darkT : light;
var kinds = { 1: 'orange', 2: 'sky', 4: 'purple', 5: 'orange', 6: 'green' };
var base = function (extra) {
return Object.assign({ height: '34px', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '13px' }, extra || {});
};
var cells = [];
for (var b = 0; b < 3; b++) cells.push({ n: '', style: base() });
for (var d = 1; d <= 31; d++) {
var k = kinds[d];
var s;
if (k) s = base({ fontWeight: 800, background: t[k].bg, color: t[k].fg });
else if (d === 7) s = base({ fontWeight: 800, boxShadow: 'inset 0 0 0 2px ' + t.fg, color: t.fg });
else if (d < 7) s = base({ color: t.muted });
else s = base({ color: t.muted, opacity: 0.5 });
cells.push({ n: String(d), style: s });
}
cells.push({ n: '', style: base() });
return { t: t, cells: cells, accent: this.props.accent ?? '#ffd23f' };
}
}
</script>
</body>
</html>
