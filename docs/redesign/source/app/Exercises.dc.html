<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exercises</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; padding: 60px 16px 0 16px; display: flex; flex-direction: column; gap: 10px">

<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px">
<h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05">Exercises</h1>
<button style="height: 44px; padding: 0 16px; border-radius: 22px; border: none; background: {{accent}}; color: #1b1b24; font-family: inherit; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New</button>
</div>

<label style="height: 52px; box-sizing: border-box; border-radius: 26px; background: {{t.surface}}; padding: 0 18px; display: flex; align-items: center; gap: 10px; color: {{t.muted}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search exercises</span>
<input type="search" placeholder="Search 63 exercises" style="flex-grow: 1; border: none; background: transparent; font-family: inherit; font-size: 16px; color: {{t.fg}}; outline: none">
</label>

<div style="display: flex; gap: 8px">
<button style="height: 40px; padding: 0 14px; border-radius: 20px; border: none; background: {{t.inv.bg}}; color: {{t.inv.fg}}; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer">All</button>
<button style="height: 40px; padding: 0 12px; border-radius: 20px; border: 1.5px solid {{t.track}}; background: {{t.surface}}; color: {{t.fg}}; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 4px; cursor: pointer">Muscle<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
<button style="height: 40px; padding: 0 12px; border-radius: 20px; border: 1.5px solid {{t.track}}; background: {{t.surface}}; color: {{t.fg}}; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 4px; cursor: pointer">Equipment<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<button style="grid-column: span 2; height: 110px; box-sizing: border-box; border: none; text-align: left; background: {{t.orange.bg}}; color: {{t.orange.fg}}; border-radius: 26px; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; font-family: inherit; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg>
<span style="display: flex; justify-content: space-between; align-items: baseline; width: 100%"><span style="font-size: 22px; font-weight: 800">Strength</span><span style="font-size: 13px; font-weight: 600">42</span></span>
</button>
<button style="height: 110px; box-sizing: border-box; border: none; text-align: left; background: {{t.sky.bg}}; color: {{t.sky.fg}}; border-radius: 26px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; font-family: inherit; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-4 3 8 2-4h7"></path></svg>
<span style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 800">Cardio</span><span style="font-size: 13px; font-weight: 600">12</span></span>
</button>
<button style="height: 110px; box-sizing: border-box; border: none; text-align: left; background: {{t.green.bg}}; color: {{t.green.fg}}; border-radius: 26px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; font-family: inherit; cursor: pointer">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c3-8 13-8 16 0M12 4v4"></path><circle cx="12" cy="10" r="2"></circle></svg>
<span style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 800">Flexibility</span><span style="font-size: 13px; font-weight: 600">9</span></span>
</button>
<button style="grid-column: span 2; height: 110px; box-sizing: border-box; border: none; text-align: left; background: {{t.inv.bg}}; color: {{t.inv.fg}}; border-radius: 26px; padding: 14px 16px; display: flex; flex-direction: column; justify-content: space-between; font-family: inherit; cursor: pointer">
<span style="display: flex; justify-content: space-between; width: 100%; align-items: center"><span style="font-size: 13px; color: {{t.inv.muted}}">My workouts</span><span style="width: 32px; height: 32px; border-radius: 16px; background: {{accent}}; color: #1b1b24; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"></path></svg></span></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 800">4 templates</span><span style="font-size: 12px; color: {{t.inv.muted}}">Full body A · Tabata core · +2</span></span>
</button>
</div>

<div style="background: {{t.surface}}; border-radius: 26px; padding: 4px 14px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 12px; height: 56px">
<span style="width: 40px; height: 40px; border-radius: 14px; background: {{t.orange.bg}}; color: {{t.orange.fg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; font-weight: 800">Sq</span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 700">Squats</span><span style="font-size: 12px; color: {{t.muted}}">Legs · Bodyweight</span></span>
<span style="padding: 4px 10px; border-radius: 999px; background: {{t.track}}; font-size: 12px; font-weight: 700">45s</span>
</div>
<div style="height: 1px; background: {{t.track}}"></div>
<div style="display: flex; align-items: center; gap: 12px; height: 56px">
<span style="width: 40px; height: 40px; border-radius: 14px; background: {{t.orange.bg}}; color: {{t.orange.fg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; font-weight: 800">Pu</span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 700">Push-ups</span><span style="font-size: 12px; color: {{t.muted}}">Chest · Bodyweight</span></span>
<span style="padding: 4px 10px; border-radius: 999px; background: {{t.track}}; font-size: 12px; font-weight: 700">40s</span>
</div>
<div style="height: 1px; background: {{t.track}}"></div>
<div style="display: flex; align-items: center; gap: 12px; height: 56px">
<span style="width: 40px; height: 40px; border-radius: 14px; background: {{t.green.bg}}; color: {{t.green.fg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; font-weight: 800">Pl</span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 700">Plank</span><span style="font-size: 12px; color: {{t.muted}}">Core · Bodyweight</span></span>
<span style="padding: 4px 10px; border-radius: 999px; background: {{t.track}}; font-size: 12px; font-weight: 700">60s</span>
</div>
<div style="height: 1px; background: {{t.track}}"></div>
<div style="display: flex; align-items: center; gap: 12px; height: 56px">
<span style="width: 40px; height: 40px; border-radius: 14px; background: {{t.orange.bg}}; color: {{t.orange.fg}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; font-weight: 800">Ks</span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 700">Kettlebell swing</span><span style="font-size: 12px; color: {{t.muted}}">Posterior · Kettlebell</span></span>
<span style="padding: 4px 10px; border-radius: 999px; background: {{t.track}}; font-size: 12px; font-weight: 700">40s</span>
</div>
</div>

<nav aria-label="Main" style="position: absolute; left: 24px; right: 24px; bottom: 26px; height: 64px; border-radius: 32px; background: {{t.nav.bg}}; padding: 8px; box-sizing: border-box; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; align-items: center">
<button aria-label="Today" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{t.nav.icon}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
<button aria-label="Exercises" style="height: 48px; border-radius: 24px; border: none; background: {{accent}}; color: #1b1b24; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg></button>
<button aria-label="Health" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{t.nav.icon}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-4 3 8 2-4h7"></path></svg></button>
<button aria-label="History" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{t.nav.icon}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></button>
<button aria-label="Stats" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{t.nav.icon}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#ffd23f","options":["#ffd23f","#7ee0a8","#ff9d6b","#9fc5ff"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var dark = this.props.dark ?? false;
var light = {
bg: '#f1f2f6', surface: '#ffffff', fg: '#1b1b24', muted: '#5a5b6b', track: '#e9eaef',
inv: { bg: '#1b1b24', fg: '#ffffff', muted: '#b8b9c8' },
nav: { bg: '#1b1b24', icon: '#b8b9c8' },
orange: { bg: '#ffd9bf', fg: '#5a2106', icon: '#c2410c', chip: '#ffffff' },
blue: { bg: '#d6e8ff', fg: '#0b2a52', bar: '#2563c9', track: '#ffffff' },
purple: { bg: '#e7e0ff', fg: '#33206e', chip: '#ffffff' },
sky: { bg: '#d4f0ff', fg: '#0b3a52', chip: '#ffffff' },
green: { bg: '#d6f5e0', fg: '#0e4425', chip: '#ffffff' },
red: { bg: '#ffdede', fg: '#6b1616', chip: '#ffffff' }
};
var darkT = {
bg: '#111118', surface: '#1c1c26', fg: '#f1f1f6', muted: '#a3a4b5', track: '#2c2c3a',
inv: { bg: '#2a2a3a', fg: '#ffffff', muted: '#b8b9c8' },
nav: { bg: '#26263a', icon: '#a3a4b5' },
orange: { bg: '#3a1f10', fg: '#ffd9bf', icon: '#fb923c', chip: '#4d2a15' },
blue: { bg: '#13263f', fg: '#d6e8ff', bar: '#60a5fa', track: '#22395a' },
purple: { bg: '#251c44', fg: '#e7e0ff', chip: '#33285a' },
sky: { bg: '#0f2a36', fg: '#bfe8fb', chip: '#17394a' },
green: { bg: '#10291a', fg: '#c4f5d4', chip: '#173a25' },
red: { bg: '#2e1414', fg: '#ffd0d0', chip: '#451e1e' }
};
return { t: dark ? darkT : light, accent: this.props.accent ?? '#ffd23f' };
}
}
</script>
</body>
</html>
