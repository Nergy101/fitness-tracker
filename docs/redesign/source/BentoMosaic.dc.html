<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bento Mosaic — Workouts home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Bricolage Grotesque', system-ui, sans-serif; padding: 60px 16px 0 16px; display: flex; flex-direction: column; gap: 10px">

<div style="display: flex; justify-content: space-between; align-items: center; padding: 0 4px 6px 4px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; color: {{t.muted}}">Tuesday, 7 October</div>
<h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05">Good morning</h1>
</div>
<button aria-label="Settings" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: {{t.surface}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg></button>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">

<div style="grid-column: span 2; height: 122px; box-sizing: border-box; background: {{t.orange.bg}}; color: {{t.orange.fg}}; border-radius: 26px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 13px; font-weight: 600">Streak</span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.orange.icon}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-3 7-7 0-4-3-6-4-10-2 2-3 4-3 6-1-1-2-2-2-4-2 2-5 5-5 8 0 4 3 7 7 7z"></path></svg>
</div>
<div style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 48px; font-weight: 800; letter-spacing: -0.04em; line-height: 0.9">12</span><span style="font-size: 15px; font-weight: 600">days</span></div>
<div style="display: flex; gap: 4px">
<span style="width: 10px; height: 10px; border-radius: 5px; background: {{t.orange.icon}}"></span>
<span style="width: 10px; height: 10px; border-radius: 5px; background: {{t.orange.icon}}"></span>
<span style="width: 10px; height: 10px; border-radius: 5px; border: 2px solid {{t.orange.icon}}; box-sizing: border-box"></span>
<span style="width: 10px; height: 10px; border-radius: 5px; background: {{t.orange.icon}}"></span>
<span style="width: 10px; height: 10px; border-radius: 5px; background: {{t.orange.icon}}"></span>
<span style="width: 10px; height: 10px; border-radius: 5px; background: {{t.orange.icon}}"></span>
<span style="width: 10px; height: 10px; border-radius: 5px; border: 2px dashed {{t.orange.icon}}; box-sizing: border-box"></span>
</div>
</div>
</div>

<div style="height: 122px; box-sizing: border-box; background: {{t.blue.bg}}; color: {{t.blue.fg}}; border-radius: 26px; padding: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<div style="position: relative; width: 64px; height: 64px">
<svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="{{t.blue.track}}" stroke-width="8"></circle><circle cx="32" cy="32" r="26" fill="none" stroke="{{t.blue.bar}}" stroke-width="8" stroke-linecap="round" stroke-dasharray="142.1 163.4" transform="rotate(-90 32 32)"></circle></svg>
<div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800">87%</div>
</div>
<span style="font-size: 12px; font-weight: 600">Consistency</span>
</div>

<div style="grid-column: span 3; height: 112px; box-sizing: border-box; background: {{t.surface}}; border-radius: 26px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; font-weight: 600; color: {{t.muted}}">This week</span><span style="font-size: 18px; font-weight: 800">214 min</span></div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; align-items: end; flex-grow: 1">
<div style="height: 40%; border-radius: 6px; background: #fb923c"></div>
<div style="height: 70%; border-radius: 6px; background: #38bdf8"></div>
<div style="height: 10%; border-radius: 6px; background: {{t.track}}"></div>
<div style="height: 60%; border-radius: 6px; background: #a78bfa"></div>
<div style="height: 100%; border-radius: 6px; background: #fb923c"></div>
<div style="height: 45%; border-radius: 6px; background: #4ade80"></div>
<div style="height: 10%; border-radius: 6px; background: {{t.track}}"></div>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; font-size: 11px; color: {{t.muted}}; text-align: center"><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span><span>M</span><span style="color: {{t.fg}}; font-weight: 800">T</span></div>
</div>

<div style="height: 150px; box-sizing: border-box; background: {{t.purple.bg}}; color: {{t.purple.fg}}; border-radius: 26px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-size: 13px; font-weight: 600">Weight</span>
<svg width="100%" height="34" viewBox="0 0 90 34" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8 L16 12 L30 10 L44 18 L58 16 L72 24 L88 26"></path></svg>
<div style="display: flex; flex-direction: column"><span style="font-size: 24px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">−0.4</span><span style="font-size: 12px">kg · 30 days</span></div>
</div>

<div style="grid-column: span 2; height: 150px; box-sizing: border-box; background: {{t.inv.bg}}; color: {{t.inv.fg}}; border-radius: 26px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; color: {{t.inv.muted}}">Up next · 32 min</span>
<span style="font-size: 24px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05">Full body A</span>
<span style="font-size: 12px; color: {{t.inv.muted}}">Squats, push-ups, rows +5</span>
</div>
<button style="height: 46px; border-radius: 23px; border: none; background: {{accent}}; color: #1b1b24; font-family: inherit; font-size: 16px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"></path></svg>Start</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<button style="height: 76px; border-radius: 22px; border: none; background: {{t.sky.bg}}; color: {{t.sky.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4" r="2"></circle><path d="M8 21l3-6 3 2v5M6 12l3-4 4 1 3 3 3 1"></path></svg>Run</button>
<button style="height: 76px; border-radius: 22px; border: none; background: {{t.green.bg}}; color: {{t.green.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"></circle><path d="M10 21l2-6 2 2v4M9 13l1-4 3 1 2 3"></path></svg>Walk</button>
<button style="height: 76px; border-radius: 22px; border: none; background: {{t.purple.bg}}; color: {{t.purple.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17" r="3.5"></circle><circle cx="18.5" cy="17" r="3.5"></circle><path d="M5.5 17l4-8h6l3 8M9.5 9L12 17h-3"></path></svg>Ride</button>
<button style="height: 76px; border-radius: 22px; border: none; background: {{t.red.bg}}; color: {{t.red.fg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="13" height="10" rx="4"></rect><path d="M7 14v4a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-4M10 4v5"></path></svg>Box</button>
</div>

<nav aria-label="Main" style="position: absolute; left: 24px; right: 24px; bottom: 26px; height: 64px; border-radius: 32px; background: {{t.nav.bg}}; padding: 8px; box-sizing: border-box; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; align-items: center">
<button aria-label="Workouts" style="height: 48px; border-radius: 24px; border: none; background: {{accent}}; color: #1b1b24; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"></path></svg></button>
<button aria-label="Exercises" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{t.nav.icon}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4" r="2"></circle><path d="M8 21l3-6 3 2v5M6 12l3-4 4 1 3 3 3 1"></path></svg></button>
<button aria-label="Health" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{t.nav.icon}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-4 3 8 2-4h7"></path></svg></button>
<button aria-label="History" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{t.nav.icon}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg></button>
<button aria-label="Stats" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: {{t.nav.icon}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"></path></svg></button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#ffd23f","options":["#ffd23f","#7ee0a8","#ff9d6b","#9fc5ff"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var dark = this.props.dark ?? false;
var light = {
bg: '#f1f2f6', surface: '#ffffff', fg: '#1b1b24', muted: '#5a5b6b', track: '#e3e4ea',
inv: { bg: '#1b1b24', fg: '#ffffff', muted: '#b8b9c8' },
nav: { bg: '#1b1b24', icon: '#b8b9c8' },
orange: { bg: '#ffd9bf', fg: '#5a2106', icon: '#c2410c' },
blue: { bg: '#d6e8ff', fg: '#0b2a52', bar: '#2563c9', track: '#ffffff' },
purple: { bg: '#e7e0ff', fg: '#33206e' },
sky: { bg: '#d4f0ff', fg: '#0b3a52' },
green: { bg: '#d6f5e0', fg: '#0e4425' },
red: { bg: '#ffdede', fg: '#6b1616' }
};
var darkT = {
bg: '#111118', surface: '#1c1c26', fg: '#f1f1f6', muted: '#a3a4b5', track: '#2c2c3a',
inv: { bg: '#2a2a3a', fg: '#ffffff', muted: '#b8b9c8' },
nav: { bg: '#26263a', icon: '#a3a4b5' },
orange: { bg: '#3a1f10', fg: '#ffd9bf', icon: '#fb923c' },
blue: { bg: '#13263f', fg: '#d6e8ff', bar: '#60a5fa', track: '#22395a' },
purple: { bg: '#251c44', fg: '#e7e0ff' },
sky: { bg: '#0f2a36', fg: '#bfe8fb' },
green: { bg: '#10291a', fg: '#c4f5d4' },
red: { bg: '#2e1414', fg: '#ffd0d0' }
};
return { t: dark ? darkT : light, accent: this.props.accent ?? '#ffd23f' };
}
}
</script>
</body>
</html>
