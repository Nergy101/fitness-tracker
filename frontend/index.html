<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover is what lets the page paint the full screen in a
         standalone iOS app; without it the web view is letterboxed inside the
         safe area and the leftover strip shows the page background, which no
         CSS can reclaim (measured on an iPhone 17 Pro: 812px viewport in an
         874px screen, a 62px loss).

         `maximum-scale=1.0, user-scalable=no` used to be here to stop the
         input-focus auto-zoom. It never did that — iOS overrides both for
         accessibility, which is why the real fix is the >=16px control
         font-size in index.css — and it is the prime suspect for defeating
         viewport-fit=cover in the installed app, so it is gone. Keep this
         declaration minimal; adding scale locks back risks the letterbox. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1e1e2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>FitnessTracker</title>
    <script>
      // Apply persisted/system theme before first paint (no FOUC).
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            (!stored &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#1e1e2e");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
